version: "0.1.0"
name: "SIA Maritime Sailing & Safety Ontology"
description: "Единая предметная онтология морских терминов, архетипов, телеметрии, действий и аварийных ситуаций"

domains:
  - id: "safety"
    name: "Безопасность мореплавания"
    description: "Аварийные процедуры, штормовые действия, безопасность экипажа"
  - id: "trim"
    name: "Настройка парусов"
    description: "Тримминг, центровка парусов, форма паруса"
  - id: "reefing"
    name: "Рифление"
    description: "Порядок, пороги и техника взятия и отдачи рифов"
  - id: "maneuver"
    name: "Управление и манёвры"
    description: "Манёвры под парусами и мотором, швартовка, якорная стоянка"
  - id: "predictive"
    name: "Превентивные рекомендации"
    description: "Прогнозирование ухудшения ситуации и предупреждения"

archetypes:
  - id: "ior_classic_narrow_stern"
    name: "Классическая IOR яхта (узкая корма)"
    description: "Монохул старой школы, склонен к сильному крену и брочингу на полных курсах"
    traits:
      tendency_to_broach: "high"
      optimal_heel_max: 20.0
  - id: "modern_wide_stern_cruiser"
    name: "Современный круизер (широкая корма)"
    description: "Широкий транц, высокая начальная остойчивость, один или два пера руля"
    traits:
      tendency_to_broach: "medium"
      optimal_heel_max: 22.0
  - id: "performance_monohull"
    name: "Спортивный глиссирующий монохул"
    description: "Лёгкий корпус, глубокий бульб-киль, высокая парусность"
    traits:
      tendency_to_broach: "medium"
      optimal_heel_max: 25.0
  - id: "cruising_catamaran"
    name: "Круизный катамаран"
    description: "Два корпуса, отсутствие крена как индикатора, высокая критичность раннего рифления"
    traits:
      tendency_to_broach: "low"
      optimal_heel_max: 5.0
  - id: "performance_multihull"
    name: "Спортивный многокорпусник"
    description: "Катамаран/тримаран с экстремальными скоростями и риском оверкиля/носом вниз"
    traits:
      optimal_heel_max: 8.0

signals:
  - id: "telemetry.true_wind_speed_kt"
    name: "Истинная скорость ветра (TWS)"
    unit: "knots"
    type: "float"
  - id: "telemetry.apparent_wind_speed_kt"
    name: "Вымпельная скорость ветра (AWS)"
    unit: "knots"
    type: "float"
  - id: "telemetry.true_wind_angle_deg"
    name: "Истинный угол ветра (TWA)"
    unit: "degrees"
    type: "float"
  - id: "telemetry.apparent_wind_angle_deg"
    name: "Вымпельный угол ветра (AWA)"
    unit: "degrees"
    type: "float"
  - id: "telemetry.boat_speed_kt"
    name: "Скорость судна относительно воды (STW/SOG)"
    unit: "knots"
    type: "float"
  - id: "telemetry.heel_angle_deg"
    name: "Угол крена (Heel)"
    unit: "degrees"
    type: "float"
  - id: "telemetry.rudder_angle_deg"
    name: "Угол перекладки руля"
    unit: "degrees"
    type: "float"
  - id: "telemetry.wave_height_m"
    name: "Высота волны"
    unit: "meters"
    type: "float"
  - id: "telemetry.wave_period_s"
    name: "Период волны"
    unit: "seconds"
    type: "float"
  - id: "context.sailing_point"
    name: "Курс относительно ветра"
    type: "enum"
    values: ["close_hauled", "close_reach", "beam_reach", "broad_reach", "running"]
  - id: "context.sea_state"
    name: "Состояние моря (шкала Бофорта/Дугласа)"
    type: "enum"
    values: ["calm", "moderate", "rough", "very_rough", "phenomenal"]

actions:
  - id: "reef_main_1"
    name: "Взять 1-й риф на гроте"
  - id: "reef_main_2"
    name: "Взять 2-й риф на гроте"
  - id: "reef_main_3"
    name: "Взять 3-й риф на гроте / штормовой трисель"
  - id: "shake_out_reef"
    name: "Отдать рифы"
  - id: "furl_headsail_partial"
    name: "Частично закрутить передний парус"
  - id: "furl_headsail_full"
    name: "Полностью убрать стаксель"
  - id: "ease_main_sheet"
    name: "Потравить гика-шкот"
  - id: "trim_main_sheet"
    name: "Добыть гика-шкот"
  - id: "ease_traveler"
    name: "Сбросить каретку погона под ветер"
  - id: "ease_vang"
    name: "Потравить оттяжку гика"
  - id: "bear_away"
    name: "Увалиться под ветер"
  - id: "head_up"
    name: "Привестись к ветру"
  - id: "heave_to"
    name: "Лечь в дрейф (Heave-to)"
  - id: "deploy_sea_anchor"
    name: "Отдать плавучий якорь / дрог"
  - id: "don_lifejackets"
    name: "Надеть спасательные жилеты и страховочные пояса"
  - id: "clip_tethers"
    name: "Пристегнуться страховочными концами к леерам"

failures:
  - id: "broach"
    name: "Брочинг (неконтролируемое приведение с заваливанием на борт)"
    severity: "critical"
  - id: "knockdown"
    name: "Кнокдаун (мачта касается воды / крен > 90°)"
    severity: "critical"
  - id: "pitchpole"
    name: "Опрокидывание через нос"
    severity: "critical"
  - id: "rudder_stall"
    name: "Срыв потока на пере руля (потеря управляемости)"
    severity: "warning"
  - id: "uncontrolled_gybe"
    name: "Непроизвольный фордевинд (переброс гика)"
    severity: "critical"
  - id: "man_overboard"
    name: "Человек за бортом (MOB)"
    severity: "critical"
