version: "0.1.0"
name: "SIA Maritime Sailing & Safety Ontology"
description: "Canonical domain ontology of maritime archetypes, telemetry signals, operational actions, and failure modes"

domains:
  - id: "safety"
    name: "Maritime Safety & Emergency Procedures"
    description: "Emergency protocols, heavy weather operations, crew safety constraints"
  - id: "trim"
    name: "Sail Trim & Balance"
    description: "Sail trimming, aerodynamic balance, sail draft and twist adjustments"
  - id: "reefing"
    name: "Reefing Procedures & Thresholds"
    description: "Sequence, wind thresholds, and techniques for reducing and shaking out sail area"
  - id: "maneuver"
    name: "Helmsmanship & Maneuvers"
    description: "Under-sail and under-power maneuvers, docking, anchoring, heavy weather tactics"
  - id: "predictive"
    name: "Predictive & Advisory Alerts"
    description: "Situational awareness, deterioration warnings, and preventive recommendations"

archetypes:
  - id: "ior_classic_narrow_stern"
    name: "Classic IOR Monohull (Narrow Stern)"
    description: "Traditional displacement monohull, prone to excessive heeling and rolling/broaching on downwind courses"
    traits:
      tendency_to_broach: "high"
      optimal_heel_max: 20.0
  - id: "modern_wide_stern_cruiser"
    name: "Modern Wide-Stern Cruiser"
    description: "Broad transom, high form stability, single or twin rudder configuration"
    traits:
      tendency_to_broach: "medium"
      optimal_heel_max: 22.0
  - id: "performance_monohull"
    name: "Performance Planing Monohull"
    description: "Lightweight hull, deep bulb keel, large sail plan, capable of planing downwind"
    traits:
      tendency_to_broach: "medium"
      optimal_heel_max: 25.0
  - id: "cruising_catamaran"
    name: "Cruising Catamaran"
    description: "Twin-hull platform, no heel warning indicator, critical requirement for early proactive reefing"
    traits:
      tendency_to_broach: "low"
      optimal_heel_max: 5.0
  - id: "performance_multihull"
    name: "Performance Multihull / Trimaran"
    description: "High-speed multihull with risk of capsize or pitchpole in gusty/over-canvassed conditions"
    traits:
      optimal_heel_max: 8.0

signals:
  - id: "telemetry.true_wind_speed_kt"
    name: "True Wind Speed (TWS)"
    unit: "knots"
    type: "float"
  - id: "telemetry.apparent_wind_speed_kt"
    name: "Apparent Wind Speed (AWS)"
    unit: "knots"
    type: "float"
  - id: "telemetry.true_wind_angle_deg"
    name: "True Wind Angle (TWA)"
    unit: "degrees"
    type: "float"
  - id: "telemetry.apparent_wind_angle_deg"
    name: "Apparent Wind Angle (AWA)"
    unit: "degrees"
    type: "float"
  - id: "telemetry.boat_speed_kt"
    name: "Boat Speed (STW/SOG)"
    unit: "knots"
    type: "float"
  - id: "telemetry.heel_angle_deg"
    name: "Heel Angle"
    unit: "degrees"
    type: "float"
  - id: "telemetry.rudder_angle_deg"
    name: "Rudder Angle"
    unit: "degrees"
    type: "float"
  - id: "telemetry.wave_height_m"
    name: "Significant Wave Height"
    unit: "meters"
    type: "float"
  - id: "telemetry.wave_period_s"
    name: "Wave Period"
    unit: "seconds"
    type: "float"
  - id: "context.sailing_point"
    name: "Point of Sail"
    type: "enum"
    values: ["close_hauled", "close_reach", "beam_reach", "broad_reach", "running"]
  - id: "context.sea_state"
    name: "Sea State (Beaufort / Douglas scale)"
    type: "enum"
    values: ["calm", "moderate", "rough", "very_rough", "phenomenal"]

actions:
  - id: "reef_main_1"
    name: "Take 1st Reef in Mainsail"
  - id: "reef_main_2"
    name: "Take 2nd Reef in Mainsail"
  - id: "reef_main_3"
    name: "Take 3rd Reef in Mainsail / Set Storm Trysail"
  - id: "shake_out_reef"
    name: "Shake Out Reefs"
  - id: "furl_headsail_partial"
    name: "Partially Furl Headsail / Jib"
  - id: "furl_headsail_full"
    name: "Fully Furl Headsail"
  - id: "ease_main_sheet"
    name: "Ease Main Sheet"
  - id: "trim_main_sheet"
    name: "Trim Main Sheet"
  - id: "ease_traveler"
    name: "Drop Main Traveler to Leeward"
  - id: "ease_vang"
    name: "Ease Boom Vang"
  - id: "bear_away"
    name: "Bear Away (Steer Downwind)"
  - id: "head_up"
    name: "Head Up (Steer Closer to Wind)"
  - id: "heave_to"
    name: "Heave-to"
  - id: "deploy_sea_anchor"
    name: "Deploy Sea Anchor / Drogue"
  - id: "don_lifejackets"
    name: "Don Lifejackets and Safety Harnesses"
  - id: "clip_tethers"
    name: "Clip Safety Tethers to Jackstays"

failures:
  - id: "broach"
    name: "Broach (loss of rudder authority with severe heeling into wind)"
    severity: "critical"
  - id: "knockdown"
    name: "Knockdown (mast touches water / heel angle > 90 deg)"
    severity: "critical"
  - id: "pitchpole"
    name: "Pitchpole (catastrophic capsize bow over stern)"
    severity: "critical"
  - id: "rudder_stall"
    name: "Rudder Stall (flow separation with total loss of steering control)"
    severity: "warning"
  - id: "uncontrolled_gybe"
    name: "Accidental Gybe (uncontrolled boom swing across centerline)"
    severity: "critical"
  - id: "man_overboard"
    name: "Man Overboard (MOB)"
    severity: "critical"
