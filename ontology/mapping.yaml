version: "0.1.0"
name: "SIA Keyword to Ontology Mapping"
description: "Словарь маппинга ключевых слов и терминов естественного языка (RU/EN) на идентификаторы онтологии"

mappings:
  # Signals
  - term: "tws"
    ontology_id: "telemetry.true_wind_speed_kt"
  - term: "true wind speed"
    ontology_id: "telemetry.true_wind_speed_kt"
  - term: "скорость ветра"
    ontology_id: "telemetry.true_wind_speed_kt"
  - term: "истинный ветер"
    ontology_id: "telemetry.true_wind_speed_kt"
  - term: "aws"
    ontology_id: "telemetry.apparent_wind_speed_kt"
  - term: "apparent wind"
    ontology_id: "telemetry.apparent_wind_speed_kt"
  - term: "вымпельный ветер"
    ontology_id: "telemetry.apparent_wind_speed_kt"
  - term: "heel"
    ontology_id: "telemetry.heel_angle_deg"
  - term: "heel angle"
    ontology_id: "telemetry.heel_angle_deg"
  - term: "крен"
    ontology_id: "telemetry.heel_angle_deg"
  - term: "угол крена"
    ontology_id: "telemetry.heel_angle_deg"
  - term: "rudder"
    ontology_id: "telemetry.rudder_angle_deg"
  - term: "перо руля"
    ontology_id: "telemetry.rudder_angle_deg"
  - term: "руль"
    ontology_id: "telemetry.rudder_angle_deg"
  - term: "boat speed"
    ontology_id: "telemetry.boat_speed_kt"
  - term: "скорость яхты"
    ontology_id: "telemetry.boat_speed_kt"

  # Actions
  - term: "reef"
    ontology_id: "actions.reef_main_1"
  - term: "reefing"
    ontology_id: "actions.reef_main_1"
  - term: "рифление"
    ontology_id: "actions.reef_main_1"
  - term: "взять риф"
    ontology_id: "actions.reef_main_1"
  - term: "первый риф"
    ontology_id: "actions.reef_main_1"
  - term: "второй риф"
    ontology_id: "actions.reef_main_2"
  - term: "третий риф"
    ontology_id: "actions.reef_main_3"
  - term: "ease main"
    ontology_id: "actions.ease_main_sheet"
  - term: "потравить грот"
    ontology_id: "actions.ease_main_sheet"
  - term: "ease traveler"
    ontology_id: "actions.ease_traveler"
  - term: "погон каретки"
    ontology_id: "actions.ease_traveler"
  - term: "bear away"
    ontology_id: "actions.bear_away"
  - term: "увалиться"
    ontology_id: "actions.bear_away"
  - term: "head up"
    ontology_id: "actions.head_up"
  - term: "привестись"
    ontology_id: "actions.head_up"
  - term: "heave to"
    ontology_id: "actions.heave_to"
  - term: "лечь в дрейф"
    ontology_id: "actions.heave_to"

  # Failures
  - term: "broach"
    ontology_id: "failures.broach"
  - term: "брочинг"
    ontology_id: "failures.broach"
  - term: "knockdown"
    ontology_id: "failures.knockdown"
  - term: "кнокдаун"
    ontology_id: "failures.knockdown"
  - term: "pitchpole"
    ontology_id: "failures.pitchpole"
  - term: "опрокидывание"
    ontology_id: "failures.pitchpole"
  - term: "rudder stall"
    ontology_id: "failures.rudder_stall"
  - term: "срыв руля"
    ontology_id: "failures.rudder_stall"
