version: "0.1.0"
name: "SIA Maritime Relations Ontology"
description: "Предикаты и отношения между сущностями онтологии, утверждениями и правилами"

relations:
  - id: "REQUIRES_ACTION"
    name: "Требует действия"
    description: "Наступление условия требует немедленного или превентивного действия"
    domain: "Condition"
    range: "Action"
  - id: "TRIGGERS_AT"
    name: "Срабатывает при"
    description: "Условие активации правила или процесса по значению телеметрии"
    domain: "Rule"
    range: "SignalCondition"
  - id: "APPLIES_TO_ARCHETYPE"
    name: "Применимо к архетипу"
    description: "Ограничение области применения правила конкретным типом корпуса"
    domain: "Rule"
    range: "Archetype"
  - id: "PREVENTS_FAILURE"
    name: "Предотвращает аварию"
    description: "Действие или правило направлено на предотвращение конкретной опасности"
    domain: "Action"
    range: "Failure"
  - id: "CAUSES_FAILURE"
    name: "Приводит к аварии"
    description: "Действие или состояние, провоцирующее наступление аварии"
    domain: "Condition"
    range: "Failure"
  - id: "ASSOCIATED_WITH"
    name: "Связано с"
    description: "Концептуальная ассоциация между морскими сущностями"
    domain: "Entity"
    range: "Entity"
  - id: "CONTRADICTS"
    name: "Противоречит"
    description: "Несовместимость двух утверждений или рекомендаций в одном контексте"
    domain: "Claim"
    range: "Claim"
