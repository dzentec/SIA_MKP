version: "0.1.0"
name: "SIA Maritime Relations Ontology"
description: "Predicate vocabulary and relation taxonomy between ontology entities, claims, and formalized rules"

relations:
  - id: "REQUIRES_ACTION"
    name: "Requires Action"
    description: "Occurrence of condition mandates immediate or proactive operational action"
    domain: "Condition"
    range: "Action"
  - id: "TRIGGERS_AT"
    name: "Triggers At"
    description: "Activation trigger condition of a rule based on telemetry value threshold"
    domain: "Rule"
    range: "SignalCondition"
  - id: "APPLIES_TO_ARCHETYPE"
    name: "Applies to Archetype"
    description: "Restricts operational scope of a rule to specific vessel hull archetype"
    domain: "Rule"
    range: "Archetype"
  - id: "PREVENTS_FAILURE"
    name: "Prevents Failure Mode"
    description: "Action or rule is designed to prevent a specific catastrophic failure"
    domain: "Action"
    range: "Failure"
  - id: "CAUSES_FAILURE"
    name: "Causes Failure Mode"
    description: "Condition or incorrect action that induces a failure state"
    domain: "Condition"
    range: "Failure"
  - id: "ASSOCIATED_WITH"
    name: "Associated With"
    description: "Conceptual relationship between maritime entities"
    domain: "Entity"
    range: "Entity"
  - id: "CONTRADICTS"
    name: "Contradicts"
    description: "Mutual incompatibility of two claims or recommendations in the same context"
    domain: "Claim"
    range: "Claim"
